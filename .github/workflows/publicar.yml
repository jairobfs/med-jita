
name: Publicar MED JITA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6

      - name: Extrair aplicativo
        run: |
          mkdir -p _site
          unzip -q MED_JITA_GitHub_Pages_v6.zip -d _site
          test -f _site/index.html
          cp independente.html _site/independente.html
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
