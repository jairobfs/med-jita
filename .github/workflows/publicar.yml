
name: Publicar MED JITA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6

      - name: Validar gateway antes de publicar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('independente.html').read_text(encoding='utf-8')
          assert 'pin' in html and 'lastSig' in html
          js = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/med-jita-v18.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/med-jita-v18.js
          node tests/v18-pwa-mock.mjs
          node tests/profile-isolation-pages.mjs
          node tests/gateway-overlay.spec.mjs
          node tests/v52-identity.spec.mjs
          node tests/v53-gallery.spec.mjs
          node --check uc-native.js
          node --check site-v51/source/integrations/uc-engine.js
          node tests/uc-native.spec.mjs
          node tests/modern-uc-persistence.spec.mjs
          test -s sw.js

      - name: Extrair aplicativo
        run: |
          mkdir -p _site
          unzip -q MED_JITA_GitHub_Pages_v6.zip -d _site
          test -f _site/index.html
          mv _site/index.html _site/calculadora-legado.html
          # Publicar a interface V51/V52 real e todos os seus assets.
          cp -a site-v51/source/. _site/
          mv _site/index.html _site/calculadora.html
          cp independente.html _site/index.html
          cp independente.html _site/independente.html
          cp site-v51/source/assets/jita-cartola-avatar.svg _site/assets/jita-cartola-avatar.svg
          test -s _site/assets/jita-cartola-avatar.svg
          cp sw.js _site/sw.js
          cp manifest.webmanifest _site/manifest.webmanifest
          cp gateway-enhance.js _site/gateway-enhance.js
          cp gateway-enhance.css _site/gateway-enhance.css
          test -s _site/gateway-enhance.js
          test -s _site/gateway-enhance.css
          test -s _site/manifest.webmanifest
          test -f _site/calculadora.html
          cp site-v51/source/integrations/uc-engine.js _site/uc-engine.js
          cp uc-native.js _site/uc-native.js
          cp uc-native.css _site/uc-native.css
          python3 - <<'PY'
          from pathlib import Path
          f=Path('_site/calculadora.html')
          html=f.read_text(encoding='utf-8')
          tag='<script src="./integrations/profiles-ui.js?v=51" defer></script>'
          assert html.count(tag)==1, 'Missing modern profiles integration'
          html=html.replace(tag,'')
          assert html.count('</head>')==1
          html=html.replace('</head>','<style>.profile-gateway,.profile-controls,#accountSyncPane{display:none!important}</style></head>',1)
          f.write_text(html,encoding='utf-8')
          assert 'med-jita-brand-v11.svg' in html
          assert 'integrations/uc-engine.js' in html
          PY
          node tests/uc-built.spec.mjs
          test -f _site/index.html
          mkdir -p _site/identidade
          cp site-v51/source/identidade.html _site/identidade/index.html
          cp site-v51/source/catalog.json _site/identidade/catalog.json
          cp site-v51/source/jita-curricular.css _site/identidade/jita-curricular.css
          cp site-v51/source/integrations/med-brand-system.js _site/identidade/med-brand-system.js
          cp site-v51/source/assets/med-jita-brand-v11.svg _site/identidade/med-jita-brand-v11.svg
          cp site-v51/source/icons/jita-corpo.svg _site/identidade/jita-corpo.svg
          test -s _site/identidade/index.html
          test -s _site/identidade/catalog.json
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@v4
