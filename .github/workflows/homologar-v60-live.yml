name: Homologar V60 publicada diretamente na Cloudflare

on:
  pull_request:
    paths:
      - 'site-v51/tests/quick-nav-v60-browser.mjs'
      - '.github/workflows/homologar-v60-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chrome do executor
        working-directory: site-v51
        run: |
          npm install --no-save --package-lock=false playwright
          google-chrome --version
      - name: Testar busca e ações no site publicado sem injeções
        working-directory: site-v51
        env:
          MED_JITA_V60_LIVE: '1'
        run: node tests/quick-nav-v60-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: med-jita-v60-live-mobile
          path: site-v51/outputs/quick-v60/
          retention-days: 7
          if-no-files-found: ignore
