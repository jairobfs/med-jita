name: Validar MED JITA V57 sem dados reais

on:
  pull_request:
    paths:
      - 'site-v51/**'
      - '.github/workflows/validar-v57.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jita_ci
          POSTGRES_USER: jita_ci
          POSTGRES_PASSWORD: jita_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jita_ci -d jita_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site-v51/package.json
      - name: Dependencias para os testes
        working-directory: site-v51
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Testes completos do aplicativo e transferencia
        working-directory: site-v51
        run: npm run qa
      - name: Integracao com PostgreSQL real e historicos ficticios
        working-directory: site-v51
        env:
          MED_JITA_TEST_DATABASE_URL: postgresql://jita_ci:jita_ci@localhost:5432/jita_ci
        run: |
          node tests/postgres-real-e2e.mjs
          node tests/postgres-restore-e2e.mjs
          node tests/postgres-gateway-e2e.mjs
      - name: Garantir que nenhuma chave ou nota real entrou no repositorio
        run: |
          test ! -e site-v51/migration/export.json
          test ! -e site-v51/render-production/.env
          git diff --exit-code
