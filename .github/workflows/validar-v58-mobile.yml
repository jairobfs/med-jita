name: Homologar experiencia mobile JITA V58

on:
  pull_request:
    paths:
      - 'site-v51/tests/cloudflare-mobile-browser.mjs'
      - '.github/workflows/validar-v58-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador mobile temporario
        working-directory: site-v51
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Conferir interface, perfis e salvamento no tamanho iPhone
        working-directory: site-v51
        run: node tests/cloudflare-mobile-browser.mjs
      - name: Guardar capturas somente de dados ficticios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: med-jita-v58-mobile-qa
          path: site-v51/outputs/mobile-v58/
          if-no-files-found: ignore
          retention-days: 7
